# ─────────────────────────────────────────────────────────────
# oeis-learn — Trustworthy Experiment Foundation standalone preflight
# config (T001). Preflight-only: independent of the later foundation
# CLI/codec/pool. Frozen candidate Docker/image settings and an explicit
# requested device. No CPU fallback, no driver install, no privileged
# container. Unknown fields are rejected by the preflight loader.
# ─────────────────────────────────────────────────────────────
schema_version: preflight/v1
kind: preflight_config

# Frozen candidate image settings (exact plan tag + real resolved digest,
# captured 2026-09-17 via `docker buildx imagetools inspect`).
base_image: rocm/pytorch:rocm7.2.1_ubuntu24.04_py3.12_pytorch_release_2.9.1
base_image_digest: sha256:96a2fb24dec9896e2f8238178f0c49d0dcc4c7dcc597be09e4564316bd86d191
dockerfile: docker/foundation/Dockerfile
dependency_lock: docker/foundation/requirements.lock

# Explicit requested accelerator; HIP/ROCm only. Silent CPU fallback is
# prohibited (FR-017, SC-005).
requested_device: rocm
dtype: float32
no_cpu_fallback: true
no_driver_install: true
no_privileged_container: true

# Actual finite FP32 forward/backward/AdamW parameter-update probe.
updates: 3
optimizer: adamw
visible_terms: 20
body_tokens: 1024
timeout_minutes: 10

# Deterministic generic tensor fixtures (no OEIS solution/cohort needed):
# zero, alternating signed-256 extremes, adjacent large-integer prefixes.
fixtures:
  - kind: zero
  - kind: alternating_signed256_extremes
  - kind: adjacent_large_integer_prefixes

# Reused existing model architecture (not a third language-comparison arm).
model:
  encoder: tri_stream
  decoder: wat_transformer
  d_model: 256
  n_heads: 4
  n_encoder_layers: 4
  n_decoder_layers: 4
  d_ff: 1024
  dropout: 0.1
  max_seq_len: 1024
  max_valuation: 16
  moduli_count: 16
  use_film: true
  enable_summary_tokens: false
  seed: 20260913
