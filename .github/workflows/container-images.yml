name: Publish container images and shared build cache
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'configs/**'
      - 'docker/dev/**'
      - 'crates/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/ci-image.yml'
      - '.github/workflows/container-images.yml'
  workflow_dispatch:
    inputs:
      target:
        description: CPU qualification image or the larger ROCm training image
        type: choice
        options: [qualification, gpu]
        default: qualification
permissions:
  contents: read
concurrency:
  group: publish-image-${{ github.ref }}-${{ inputs.target || 'qualification' }}
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-image.yml
    with:
      target: ${{ inputs.target || 'qualification' }}
