name: Foundation review validation (phases 7–11)
on:
  pull_request:
    paths:
      - 'src/oeis_learn/**'
      - 'crates/oeis_wasm_evaluator/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'setup.py'
      - 'uv.lock'
      - 'docker/dev/**'
      - 'tests/**'
      - 'configs/foundation/qualified.yaml'
      - 'scripts/verify_phase8.py'
      - 'scripts/verify_phase9.py'
      - 'scripts/verify_phase11.py'
      - 'scripts/verify_phase13.py'
      - 'specs/007-experiment-foundation/contracts/**'
      - 'specs/007-experiment-foundation/tasks.md'
      - 'specs/007-experiment-foundation/quickstart.md'
      - 'specs/007-experiment-foundation/validate_artifacts.py'
      - 'specs/007-experiment-foundation/validation/adoption.md'
      - 'specs/007-experiment-foundation/validation/review-inputs.json'
      - 'specs/007-experiment-foundation/validation/phase-11-dispositions.json'
      - 'specs/007-experiment-foundation/validation/current-dispositions.json'
      - 'specs/007-experiment-foundation/validation/task-dependencies.json'
      - 'docs/foundation.md'
      - 'README.md'
      - '.github/workflows/phase7-review.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  cpu-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      PYTHONPATH: 'src:.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Create CPU test environment
        run: |
          python3 -m venv .review-venv
          .review-venv/bin/pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          .review-venv/bin/pip install -e . pytest ruff
          .review-venv/bin/pip freeze > phase7-environment.txt
      - name: Compile and check repaired modules
        run: |
          .review-venv/bin/python -m compileall -q src tests/unit/test_foundation_grounding.py tests/unit/test_foundation_symbolic.py
          .review-venv/bin/ruff check --select F,E9 src/oeis_learn/decoder/grounding.py src/oeis_learn/decoder/grounding_reference.py src/oeis_learn/decoder/recurrence.py src/oeis_learn/decoder/constant_solver.py src/oeis_learn/decoder/dixon_solver.py src/oeis_learn/decoder/qfnia_solver.py src/oeis_learn/discovery/formula_syntax.py src/oeis_learn/discovery/formula_checker.py src/oeis_learn/discovery/symbolic_prover.py src/oeis_learn/sandbox/contained.py src/oeis_learn/sandbox/optimizer.py src/oeis_learn/evaluation/repair_gate.py
          .review-venv/bin/ruff check --select F,E9 scripts/verify_phase8.py src/oeis_learn/rl/policy.py src/oeis_learn/rl/prompt_weighting.py src/oeis_learn/rl/reward.py src/oeis_learn/rl/telemetry.py src/oeis_learn/rl/trainer.py src/oeis_learn/evaluation/learning_gate.py
          .review-venv/bin/ruff check --select F,E9 src/oeis_learn/discovery src/oeis_learn/sandbox/logical_ir.py src/oeis_learn/sandbox/wide_helpers.py src/oeis_learn/sandbox/streaming.py src/oeis_learn/evaluation/discovery_gate.py tests/unit/test_foundation_extended_wat.py tests/integration/test_foundation_discovery.py tests/integration/test_foundation_extended_wat.py tests/contract/test_foundation_discovery_cli.py
      - name: Phase 11 code quality
        run: .review-venv/bin/ruff check --select F,E9 src/oeis_learn/evaluation/handoff.py src/oeis_learn/evaluation/review_dispositions.py scripts/verify_phase11.py scripts/archive_phase11.py tests/unit/test_foundation_handoff.py
      - name: Spec Kit prerequisites and artifact consistency
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/007-experiment-foundation
        run: |
          bash .specify/scripts/bash/check-prerequisites.sh --json --require-tasks --include-tasks
          .review-venv/bin/python specs/007-experiment-foundation/validate_artifacts.py
      - name: Foundation and phase 7 CPU regression suite
        run: |
          .review-venv/bin/python -m pytest -q --durations=20 -ra tests/unit/test_foundation_*.py tests/unit/test_bootstrap_*.py tests/unit/test_connected_sampler.py tests/contract/test_foundation_*.py tests/integration/test_foundation_*.py --junitxml=phase7-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase7-cpu-validation
          path: |
            phase7-junit.xml
            phase7-environment.txt

  cpu-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [input-diagnostics, quickstart, training-integration]
    env:
      OMP_NUM_THREADS: '2'
      PYTHONPATH: 'src:.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Create CPU test environment
        run: |
          python3 -m venv .review-venv
          .review-venv/bin/pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          .review-venv/bin/pip install -e . pytest ruff
          .review-venv/bin/pip freeze > phase7-${{ matrix.check }}-environment.txt
      - name: Execute phase 13 available CPU input diagnostics
        if: matrix.check == 'input-diagnostics'
        run: .review-venv/bin/python scripts/verify_phase13.py --output phase13-evidence
      - name: Execute actual CPU quickstart and replay immutable archive
        if: matrix.check == 'quickstart'
        run: |
          .review-venv/bin/python scripts/verify_phase11.py --output phase11-evidence/quickstart
          .review-venv/bin/python -m oeis_learn.evaluation.handoff --archive phase11-evidence/quickstart/handoff
      - name: Training and verified replay integration
        if: matrix.check == 'training-integration'
        run: |
          .review-venv/bin/python -m pytest -q --durations=20 \
            tests/integration/test_egca_training_step.py tests/integration/test_bootstrap_admission.py \
            --junitxml=phase7-training-integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase7-cpu-${{ matrix.check }}
          path: |
            phase7-${{ matrix.check }}-environment.txt
            phase7-training-integration.xml
            phase13-evidence/**
            phase11-evidence/quickstart/*.stdout
            phase11-evidence/quickstart/*.stderr
            phase11-evidence/quickstart/quickstart.json
            phase11-evidence/quickstart/handoff/inputs.json
            phase11-evidence/quickstart/handoff/handoff.json
