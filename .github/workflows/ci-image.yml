name: Build shared CI image
on:
  workflow_call:
    inputs:
      target:
        type: string
        default: qualification
    outputs:
      reference:
        description: Exact pushed digest or archived image tag
        value: ${{ jobs.build.outputs.reference }}
      transport:
        value: ${{ jobs.build.outputs.transport }}
      artifact:
        value: ${{ jobs.build.outputs.artifact }}
      podman_build:
        value: ${{ jobs.build.outputs.podman_build }}
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      reference: ${{ steps.result.outputs.reference }}
      transport: ${{ steps.plan.outputs.transport }}
      artifact: ${{ steps.plan.outputs.artifact }}
      podman_build: ${{ steps.plan.outputs.podman_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          # PR merge commit plus both parents, including the base used for the recipe diff.
          fetch-depth: 2
          persist-credentials: false
      - name: Plan registry, cache and permission-free fallback
        id: plan
        env:
          CI_IMAGE_TARGET: ${{ inputs.target }}
        run: python3 scripts/ci/images.py plan
      - uses: docker/setup-buildx-action@v4
      - name: Authenticate trusted publisher
        if: steps.plan.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build pinned guest/native layers and current checkout once
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ inputs.target }}
          platforms: linux/amd64
          tags: ${{ steps.plan.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: ${{ steps.plan.outputs.publish == 'true' }}
          load: ${{ steps.plan.outputs.publish != 'true' }}
          provenance: false
          cache-from: ${{ steps.plan.outputs.cache_from }}
          cache-to: ${{ steps.plan.outputs.cache_to }}
      - name: Export immutable reference or fork archive
        id: result
        env:
          TRANSPORT: ${{ steps.plan.outputs.transport }}
          IMAGE_NAME: ${{ steps.plan.outputs.image }}
          IMAGE_TAG: ${{ steps.plan.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ "$TRANSPORT" = registry ]; then
            [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "reference=$IMAGE_NAME@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          else
            docker save --output "$RUNNER_TEMP/ci-image.tar" "$IMAGE_TAG"
            echo "reference=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Share image without registry write permission
        if: steps.plan.outputs.transport == 'archive'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: ${{ runner.temp }}/ci-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Record image provenance
        env:
          IMAGE_REFERENCE: ${{ steps.result.outputs.reference }}
          IMAGE_TRANSPORT: ${{ steps.plan.outputs.transport }}
        run: |
          printf '### Shared CI image\n\nSource: `%s`\n\nTransport: `%s`\n\nImage: `%s`\n' \
            "$GITHUB_SHA" "$IMAGE_TRANSPORT" "$IMAGE_REFERENCE" >> "$GITHUB_STEP_SUMMARY"
