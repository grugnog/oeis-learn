# Optional distribution audit. Routine CI checks installed-image imports and
# native execution without rebuilding an sdist or repeating release qualification.
name: Manual packaging and release audit
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-image.yml
  installed-wheel-native:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/load-ci-image
        with:
          engine: docker
          reference: ${{ needs.image.outputs.reference }}
          transport: ${{ needs.image.outputs.transport }}
          artifact: ${{ needs.image.outputs.artifact }}
          alias: oeis-foundation-wheel
          token: ${{ github.token }}
      - name: Wheel acceptance outside checkout, actual native parity, G7 through G9
        run: |
          mkdir -p wheel-evidence
          chmod 777 wheel-evidence
          docker image inspect oeis-foundation-wheel --format '{{.Id}}' > wheel-evidence/image-id.txt
          docker run --rm -v "$PWD/wheel-evidence:/evidence" oeis-foundation-wheel bash -c '
            set -euo pipefail
            trap "chmod -R a+rX /evidence" EXIT
            export OEIS_WHEEL_WORK_ROOT=/evidence
            export OEIS_NATIVE_WHEELS_DIR=/tmp/oeis-wheels
            export OEIS_REQUIRE_NATIVE=1
            mkdir -p /evidence/native-wheels
            cp /tmp/oeis-wheels/*.whl /evidence/native-wheels/
            python -m oeis_learn.evaluation.repair_gate --output /evidence
            python -m oeis_learn.evaluation.learning_gate --output /evidence/learning
            oeis-learn foundation qualify-discovery --native --output /evidence/discovery --json > /evidence/discovery-qualification-cli.json
            export OEIS_QUALIFICATION_EVIDENCE=/evidence
            bash scripts/foundation/test_wheel.sh
            ruff check --select F,E9 src/oeis_learn/evaluation/cli_acceptance.py src/oeis_learn/evaluation/source_policy.py src/oeis_learn/evaluation/experiment_runner.py src/oeis_learn/evaluation/fuel_escalation.py src/oeis_learn/evaluation/overflow_diagnostics.py src/oeis_learn/evaluation/legacy_wrappers.py src/oeis_learn/experiments/decisions.py src/oeis_learn/experiments/source_snapshot.py tests/contract/test_foundation_qualified_cli.py
            python -m pytest -q --durations=20 tests/integration/test_egca_training_step.py tests/unit/test_foundation_source_policy.py tests/unit/test_foundation_decisions.py tests/unit/test_foundation_legacy_wrappers.py tests/unit/test_foundation_measurement.py tests/unit/test_foundation_phase10_integration.py tests/unit/test_foundation_handoff.py tests/integration/test_foundation_overflow_diagnostics.py tests/contract/test_foundation_qualified_cli.py --junitxml=/evidence/phase10.xml
            python -m pytest -q --durations=20 tests/unit/test_foundation_sampler.py tests/unit/test_bootstrap_models.py tests/unit/test_bootstrap_decoder_inputs.py tests/unit/test_bootstrap_bundle.py tests/unit/test_bootstrap_workflow.py tests/unit/test_connected_sampler.py tests/integration/test_bootstrap_admission.py --junitxml=/evidence/bootstrap.xml
          '
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Actual Docker role and persistent worker acceptance from host
        run: |
          python3 -m venv .role-venv
          .role-venv/bin/pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          .role-venv/bin/pip install -e . pytest
          export OEIS_ROLE_TEST_IMAGE=$(docker image inspect oeis-foundation-wheel --format '{{.Id}}')
          OMP_NUM_THREADS=2 .role-venv/bin/python -m pytest -q --durations=20 tests/unit/test_foundation_roles.py --junitxml=wheel-evidence/roles.xml
      - name: Archive and freshly replay current cross-cutting evidence
        run: |
          docker run --rm -v "$PWD/wheel-evidence:/evidence" oeis-foundation-wheel bash -c '
            set -euo pipefail
            trap "chmod -R a+rX /evidence" EXIT
            python scripts/archive_phase11.py --evidence /evidence
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-wheel-native
          path: |
            wheel-evidence/installed-wheel-*/source-distribution.xml
            wheel-evidence/installed-wheel-*/rebuilt/*.whl
            wheel-evidence/installed-wheel-*/installed-wheel.xml
            wheel-evidence/installed-wheel-*/installed-help.txt
            wheel-evidence/installed-wheel-*/wheels/*.whl
            wheel-evidence/*.xml
            wheel-evidence/g7.json
            wheel-evidence/native/parity.json
            wheel-evidence/learning/*.xml
            wheel-evidence/learning/g8.json
            wheel-evidence/discovery/*.xml
            wheel-evidence/discovery/g9.json
            wheel-evidence/phase10.xml
            wheel-evidence/handoff-inputs.json
            wheel-evidence/handoff/**
            wheel-evidence/native-wheels/*.whl
            wheel-evidence/image-id.txt
            wheel-evidence/learning/cli-acceptance.json
            wheel-evidence/discovery/cli-acceptance.json
