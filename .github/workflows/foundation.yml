name: Container and native acceptance
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'configs/foundation/**'
      - 'docker/dev/**'
      - 'crates/**'
      - 'specs/008-bigint-constant-synthesis/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - 'setup.py'
      - 'Dockerfile'
      - '.dockerignore'
      - 'MANIFEST.in'
      - '.specify/memory/constitution.md'
      - 'specs/005-trustworthy-synthesis-readiness/contracts/**'
      - 'specs/007-experiment-foundation/contracts/**'
      - 'specs/007-experiment-foundation/tasks.md'
      - 'specs/007-experiment-foundation/quickstart.md'
      - 'specs/007-experiment-foundation/validate_artifacts.py'
      - 'specs/007-experiment-foundation/validation/adoption.md'
      - 'specs/007-experiment-foundation/validation/review-inputs.json'
      - 'specs/007-experiment-foundation/validation/phase-11-dispositions.json'
      - 'specs/007-experiment-foundation/validation/current-dispositions.json'
      - 'specs/007-experiment-foundation/validation/task-dependencies.json'
      - 'docs/foundation.md'
      - 'README.md'
      - '.github/workflows/**'
      - '.github/actions/load-ci-image/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: read
jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-image.yml

  podman-build:
    needs: image
    if: needs.image.outputs.podman_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify Podman can build changed container inputs
        run: podman build --target qualification -t oeis-podman-build-ci .

  portable-engines:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/load-ci-image
        with:
          engine: ${{ matrix.engine }}
          reference: ${{ needs.image.outputs.reference }}
          transport: ${{ needs.image.outputs.transport }}
          artifact: ${{ needs.image.outputs.artifact }}
          alias: oeis-portable-ci
          token: ${{ github.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Actual private worker, persistent service and reclamation
        env:
          OEIS_CONTAINER_ENGINE: ${{ matrix.engine }}
        run: |
          python3 -m venv .role-venv
          .role-venv/bin/pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          .role-venv/bin/pip install -e . pytest
          export OEIS_ROLE_TEST_IMAGE=$($OEIS_CONTAINER_ENGINE image inspect oeis-portable-ci --format '{{.Id}}')
          export OEIS_FOUNDATION_TEST_IMAGE=$OEIS_ROLE_TEST_IMAGE
          mkdir -p tmp-engine-evidence
          OMP_NUM_THREADS=2 .role-venv/bin/python -m pytest -q --durations=20 \
            tests/unit/test_container_runtime.py tests/unit/test_container_validation.py \
            tests/unit/test_foundation_roles.py \
            tests/integration/test_foundation_resources.py::test_actual_container_worker_mount_and_device_isolation \
            --basetemp=tmp-engine-evidence/pytest --junitxml=tmp-engine-evidence/${{ matrix.engine }}.xml
      - name: Public standard-library CLI validation and verified rerun
        env:
          OEIS_CONTAINER_ENGINE: ${{ matrix.engine }}
        run: |
          export OEIS_ROLE_TEST_IMAGE=$($OEIS_CONTAINER_ENGINE image inspect oeis-portable-ci --format '{{.Id}}')
          .role-venv/bin/python -m pytest -q --durations=20 tests/integration/test_portable_cli.py \
            --junitxml=tmp-engine-evidence/public-cli.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-${{ matrix.engine }}
          path: |
            tmp-engine-evidence/*.xml
            tmp-engine-evidence/pytest/**/*.log
            tmp-engine-evidence/pytest/**/container-inspect.json
            tmp-engine-evidence/public-cli/*.log
            tmp-engine-evidence/public-cli/validation/validation.json
            tmp-engine-evidence/public-cli/validation/*/receipt.json
            tmp-engine-evidence/public-cli/validation/*/*.log
            tmp-engine-evidence/public-cli/validation/*/*.xml

  native-qualification:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/load-ci-image
        with:
          engine: docker
          reference: ${{ needs.image.outputs.reference }}
          transport: ${{ needs.image.outputs.transport }}
          artifact: ${{ needs.image.outputs.artifact }}
          alias: oeis-phase7
          token: ${{ github.token }}
      - name: Installed image resources and native execution outside checkout
        run: |
          mkdir -p phase7-evidence
          chmod 777 phase7-evidence
          docker run --rm --workdir /tmp -v "$PWD/phase7-evidence:/evidence" oeis-phase7 bash -c '
            set -euo pipefail
            trap "chmod -R a+rX /evidence" EXIT
            cp /opt/oeis-build/tests/contract/test_foundation_qualified_cli.py /tmp/test_installed_cli.py
            unset PYTHONPATH
            export OEIS_INSTALLED_WHEEL=1 OEIS_REQUIRE_NATIVE=1
            python -I -m pytest -q --durations=20 \
              /tmp/test_installed_cli.py::test_packaged_resources_and_actual_execution \
              /tmp/test_installed_cli.py::test_installed_native_has_no_fallback \
              --junitxml=/evidence/installed-image.xml
            oeis-learn foundation --help > /evidence/installed-help.txt
          '
      - name: Training and verified replay integration with packaged native fitter
        run: |
          mkdir -p phase7-evidence
          chmod 777 phase7-evidence
          docker run --rm -v "$PWD/phase7-evidence:/evidence" oeis-phase7 bash -c '
            set -euo pipefail
            trap "chmod -R a+rX /evidence" EXIT
            export OMP_NUM_THREADS=2 OEIS_REQUIRE_BIGINT_BUILD=1
            cd /opt/oeis-build
            python -m pytest -q --durations=20 \
              tests/integration/test_egca_training_step.py \
              tests/integration/test_co_training_step.py \
              tests/integration/test_bootstrap_admission.py \
              --junitxml=/evidence/training-integration.xml
          '
      - name: Mandatory Rust tests and G7 qualification
        run: |
          mkdir -p phase7-evidence
          chmod 777 phase7-evidence
          docker run --rm -v "$PWD/phase7-evidence:/evidence" oeis-phase7 bash -c '
            set -euo pipefail
            trap "chmod -R a+rX /evidence" EXIT
            export OEIS_REQUIRE_BIGINT_BUILD=1 OEIS_REQUIRE_NATIVE=1
            mkdir -p /evidence/build-info/src
            cp /opt/oeis-build-info/* /evidence/build-info/
            cp crates/oeis_wasm_evaluator/src/*.rs /evidence/build-info/src/
            cp crates/oeis_wasm_evaluator/build.rs /evidence/build-info/
            rustfmt --edition 2021 /evidence/build-info/src/*.rs /evidence/build-info/build.rs
            cd /opt/oeis-build
            python -m oeis_learn.evaluation.repair_gate --output /evidence
            python -m oeis_learn.evaluation.learning_gate --output /evidence/learning
            PYTHONPATH=/opt/oeis-build/src:/opt/oeis-build python scripts/verify_phase8.py --evidence /evidence
            oeis-learn foundation qualify-discovery --native --output /evidence/discovery --json > /evidence/discovery-qualification-cli.json
            PYTHONPATH=/opt/oeis-build/src:/opt/oeis-build python scripts/verify_phase9.py --evidence /evidence
            oeis-learn foundation activate-qualified --config /evidence/qualified-contract.json --gate-report /evidence/g7.json --profiles /evidence/profiles --json > /evidence/activation-cli.json
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase7-native-qualification
          path: |
            phase7-evidence/*.xml
            phase7-evidence/installed-help.txt
            phase7-evidence/g7.json
            phase7-evidence/activation.json
            phase7-evidence/activation-cli.json
            phase7-evidence/qualified-contract.json
            phase7-evidence/profiles/
            phase7-evidence/rust-tests.txt
            phase7-evidence/native/parity.json
            phase7-evidence/build-info/
            phase7-evidence/discovery/*.xml
            phase7-evidence/discovery/g9.json
            phase7-evidence/discovery-qualification-cli.json
            phase7-evidence/discovery/cli-acceptance.json
            phase7-evidence/discovery/cli-discovery/discovery.json
            phase7-evidence/discovery/cli-certificate/certificate-check.json
            phase7-evidence/learning/*.xml
            phase7-evidence/learning/g8.json
            phase7-evidence/learning/cli-acceptance.json
            phase7-evidence/learning/learning-contract.json
            phase7-evidence/learning/training/learning-inputs.json
            phase7-evidence/learning/training/ledger.json
            phase7-evidence/learning/search/search.json

  bigint-qualification:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        partition: [arithmetic, fitting, containment, performance]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/load-ci-image
        with:
          engine: docker
          reference: ${{ needs.image.outputs.reference }}
          transport: ${{ needs.image.outputs.transport }}
          artifact: ${{ needs.image.outputs.artifact }}
          alias: oeis-bigint-qualification
          token: ${{ github.token }}
      - name: Mandatory Phase 5 suites and measurement in the shared image
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          mkdir -p tmp-phase5-evidence
          chmod 777 tmp-phase5-evidence
          docker run --rm --network none --read-only --user 12345:12345 \
            --memory 16g --memory-swap 16g --cpus 2 --pids-limit 512 \
            --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,size=2g \
            -e HOME=/tmp -e OMP_NUM_THREADS=2 -e OEIS_REQUIRE_BIGINT_BUILD=1 -e OEIS_REQUIRE_NATIVE=1 \
            -e OEIS_QUALIFICATION_IMAGE="$(docker image inspect oeis-bigint-qualification --format '{{.Id}}')" \
            -e PYTHONPATH=/opt/oeis-build/src:/opt/oeis-build -e PARTITION \
            -v "$PWD/tmp-phase5-evidence:/evidence" oeis-bigint-qualification bash -c '
              set -euo pipefail
              trap "find /evidence -mindepth 1 -exec chmod a+rX {} +" EXIT
              if [ "$PARTITION" = performance ]; then
                python scripts/benchmark_bigint.py --output /evidence
              else
                python scripts/qualify_bigint_phase5.py --inside "$PARTITION" --output /evidence
              fi
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bigint-qualification-${{ matrix.partition }}
          path: tmp-phase5-evidence/

  bigint-preparation:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        partition: [contracts, native]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/load-ci-image
        with:
          engine: docker
          reference: ${{ needs.image.outputs.reference }}
          transport: ${{ needs.image.outputs.transport }}
          artifact: ${{ needs.image.outputs.artifact }}
          alias: oeis-bigint-ci
          token: ${{ github.token }}
      - name: Contract shapes and actual arbitrary-UID packaged artifacts
        if: matrix.partition == 'contracts'
        run: |
          mkdir -p tmp-bigint-evidence
          chmod 777 tmp-bigint-evidence
          docker run --rm --user 12345:12345 --network none --read-only --tmpfs /tmp \
            -e HOME=/tmp -e OEIS_REQUIRE_BIGINT_BUILD=1 -e PYTHONPATH=/opt/oeis-build/src:/opt/oeis-build \
            -v "$PWD/tmp-bigint-evidence:/evidence" oeis-bigint-ci bash -c '
              set -euo pipefail
              # UID 12345 owns the reports, but not the runner-owned mount root.
              trap "find /evidence -mindepth 1 -exec chmod a+rX {} +" EXIT
              python scripts/qualify_bigint_phase2.py --inside --output /evidence
              python -m pytest -q -m "not gpu" -p no:cacheprovider --basetemp=/tmp/phase3-pytest --junitxml=/evidence/phase3.xml tests/contract/test_bigint_workflow.py tests/integration/test_synthesis_worker.py tests/integration/test_bigint_workflow.py tests/unit/test_bigint_ci_regressions.py
              python -I -m oeis_learn.synthesis.retirement --installed --output /evidence/retirement-installed.json
              python -m pytest -q -m "not gpu" -p no:cacheprovider --basetemp=/tmp/phase4-pytest --junitxml=/evidence/phase4.xml tests/contract/test_solver_retirement.py tests/unit/test_retirement_callers.py
              cp /opt/oeis-build-info/bigint-build.json /evidence/
            '
      - name: Native dependency and retained-profile tests in shared image
        if: matrix.partition == 'native'
        run: |
          mkdir -p tmp-bigint-evidence
          chmod 777 tmp-bigint-evidence
          docker run --rm --network none -e CARGO_TARGET_DIR=/opt/oeis-native-target \
            -v "$PWD/tmp-bigint-evidence:/evidence" oeis-bigint-ci bash -c '
              set -euo pipefail
              trap "chmod -R a+rX /evidence" EXIT
              cargo test --release --locked --offline --manifest-path crates/oeis_synthesis_core/Cargo.toml > /evidence/core-tests.txt 2>&1
              cargo test --release --locked --offline --no-default-features --manifest-path crates/oeis_wasm_evaluator/Cargo.toml > /evidence/retained-tests.txt 2>&1
              python -I -m oeis_learn.synthesis.retirement --installed --output /evidence/retirement-installed.json
              python -m pytest -q -m "not gpu" -p no:cacheprovider --basetemp=/tmp/phase4-pytest --junitxml=/evidence/phase4.xml tests/contract/test_solver_retirement.py tests/unit/test_retirement_callers.py
              cp /opt/oeis-build-info/bigint-build.json /evidence/
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bigint-preparation-${{ matrix.partition }}
          path: tmp-bigint-evidence/
