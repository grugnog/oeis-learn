[package]
name = "oeis_wasm_evaluator"
version = "0.1.0"
edition = "2021"
description = "Bounded native WASM evaluator with fuel metering for oeis-learn"

[lib]
name = "oeis_wasm_evaluator"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20" }
wasmtime = "20.0"
wat = "1.0"

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]
