[package]
name = "oeis_synthesis_core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
dashu-base = { version = "=0.6.1", default-features = false }
dashu-int = { version = "=0.6.2", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
z3 = { version = "=0.21.1", default-features = false, features = ["vendored"] }
wasmtime = "=20.0.2"
wasmparser = "=0.202.0"
wat = "=1.261.0"
