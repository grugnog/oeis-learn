[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oeis-learn"
version = "0.1.0"
description = "Neuro-Symbolic Synthesis, Continuous Representations, and Mathematical Discovery for OEIS"
authors = [{ name = "OEIS Learn Contributors" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "duckdb>=0.10.0",
    "mpmath>=1.3.0",
    "sympy>=1.12",
    "pyyaml>=6.0",
    "pyarrow>=14.0.0",
    "numpy>=1.24.0",
    "wasmtime>=20.0.0",
    "z3-solver>=4.12.0",
    "scikit-learn",
]

[project.scripts]
oeis-learn = "oeis_learn.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

# ── uv project metadata ───────────────────────────────────────
# This project is managed with uv (https://docs.astral.sh/uv/). Use `uv sync`
# (optionally `uv sync --all-extras`) to create/refresh the environment and
# `uv run` to execute commands, instead of `pip` / `python -m venv`.
# The lockfile is uv.lock at the repository root.
[tool.uv]
# Package the project (src layout) and install its console script on `uv sync`.
package = true
# Prefer the host's system Python instead of downloading a uv-managed one:
# the ROCm host and sandbox block astral's python-build-standalone downloads
# (github.com). Any Python >= 3.11 (per requires-python) is accepted.
python-preference = "system"

# Dev/test/lint tooling is a uv dependency group so `uv sync` installs it by
# default (no `--extra dev` needed).
[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-benchmark>=4.0.0",
    "maturin>=1.4.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "jsonschema>=4.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
